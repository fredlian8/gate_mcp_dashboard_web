name: SmartMoney Daily Refresh

on:
  schedule:
    # 每天 17:00 UTC（北京时间 01:00）
    - cron: '0 17 * * *'
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Call Render refresh endpoint
        env:
          REFRESH_URL: ${{ secrets.SMARTMONEY_REFRESH_URL }}
          REFRESH_TOKEN: ${{ secrets.SMARTMONEY_REFRESH_TOKEN }}
        run: |
          if [ -z "$REFRESH_URL" ]; then
            echo "Missing secrets.SMARTMONEY_REFRESH_URL" >&2
            exit 1
          fi
          if [ -z "$REFRESH_TOKEN" ]; then
            echo "Missing secrets.SMARTMONEY_REFRESH_TOKEN" >&2
            exit 1
          fi

          echo "Calling: $REFRESH_URL"
          http_code=$(curl -sS -o refresh_result.json -w "%{http_code}" -X POST "$REFRESH_URL" \
            -H "x-refresh-token: $REFRESH_TOKEN" \
            -H "content-type: application/json" \
            --data '{}' \
            --max-time 840)

          echo "Refresh HTTP status: $http_code"
          echo "Refresh response body:"
          cat refresh_result.json || true
          echo ""

          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "Refresh failed with HTTP $http_code" >&2
            exit 1
          fi

      - name: Check refresh status (optional)
        if: always()
        env:
          STATUS_URL: ${{ secrets.SMARTMONEY_REFRESH_STATUS_URL }}
        run: |
          if [ -z "$STATUS_URL" ]; then
            echo "SMARTMONEY_REFRESH_STATUS_URL not set; skipping status check"
            exit 0
          fi

          echo "Calling status: $STATUS_URL"
          http_code=$(curl -sS -o refresh_status.json -w "%{http_code}" -X GET "$STATUS_URL" --max-time 60)
          echo "Status HTTP status: $http_code"
          echo "Status response body:"
          cat refresh_status.json || true
          echo ""
